name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    name: Rust and xterm.js (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v6
      - name: Install project Rust toolchain
        shell: bash
        run: |
          rust_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')"
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt --component clippy
          rustup default "$rust_version"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/xterm/package-lock.json
      - name: Verify Vim fixture is available
        run: vim --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Additional Vim smoke test
        run: cargo test --locked --lib shell::pty::session::tests::ignored_vim_smoke_starts_and_exits -- --ignored --exact
      - name: Install pinned xterm.js dependencies
        run: npm --prefix tests/xterm ci --ignore-scripts --no-audit --no-fund
      - name: Replay real PTY scenarios with xterm.js
        run: npm --prefix tests/xterm test
      - name: Preserve terminal traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xterm-traces-${{ matrix.os }}
          path: target/xterm
          if-no-files-found: ignore
          retention-days: 7
